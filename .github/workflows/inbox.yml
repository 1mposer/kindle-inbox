name: inbox

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      title:
        description: Book title (and optionally author)
        required: false
  push:
    branches: [main]
    paths: ["manifest.json", "books/**", "scripts/**", ".github/workflows/inbox.yml"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# Runs are serialised. GitHub keeps only one queued run, so every run sweeps
# all open request issues instead of trusting the issue that triggered it.
concurrency:
  group: inbox
  cancel-in-progress: false

jobs:
  fetch:
    # Only the repository owner can put books on the Kindle.
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.add.outputs.results }}
      summary: ${{ steps.add.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Find and add books
        id: add
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        run: |
          if [ -n "$INPUT_TITLE" ]; then
            python3 -I scripts/fetch_book.py add "$INPUT_TITLE"
          else
            gh issue list --repo "$REPO" --state open --author "$OWNER" --limit 20 \
              --json number,title,body > "$RUNNER_TEMP/issues.json"
            python3 -I scripts/fetch_book.py sweep "$RUNNER_TEMP/issues.json"
          fi
      - name: Rebuild feeds
        if: github.event_name == 'push'
        run: python3 -I scripts/fetch_book.py build
      - name: Commit
        env:
          SUMMARY: ${{ steps.add.outputs.summary }}
        run: |
          git config user.name "kindle-inbox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A books manifest.json opds.xml index.html
          if ! git diff --cached --quiet; then
            git commit -m "inbox: ${SUMMARY:-rebuild}"
            git pull --rebase -q origin main
            git push
          fi
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r books manifest.json opds.xml index.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  report:
    needs: [fetch, deploy]
    if: always() && github.event_name == 'issues' && needs.fetch.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULTS: ${{ needs.fetch.outputs.results }}
          DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          FETCH: ${{ needs.fetch.result }}
        run: |
          if [ "$FETCH" != "success" ]; then
            gh issue comment "$EVENT_ISSUE" --repo "$REPO" --body "Something went wrong. Reopen the issue to retry. $RUN_URL"
            exit 0
          fi
          # An earlier run may already have handled this issue in its sweep.
          [ -n "$RESULTS" ] && [ "$RESULTS" != "[]" ] || exit 0
          printf '%s' "$RESULTS" | jq -c '.[]' | while read -r r; do
            n=$(jq -r .number <<<"$r"); status=$(jq -r .status <<<"$r")
            msg=$(jq -r .message <<<"$r"); src=$(jq -r .source_url <<<"$r")
            case "$status" in
              added)
                body="$msg"$'\n\n'"Source: $src"$'\n\n'"It downloads to the Kindle's Inbox shelf the next time the Kindle is awake on Wi-Fi."
                [ "$DEPLOY" = "success" ] || body="$body"$'\n\n'"(The feed did not deploy; it goes out with the next request.)"
                gh issue comment "$n" --repo "$REPO" --body "$body"
                gh issue close "$n" --repo "$REPO" --reason completed ;;
              duplicate)
                gh issue comment "$n" --repo "$REPO" --body "$msg"
                gh issue close "$n" --repo "$REPO" --reason completed ;;
              notfound)
                gh issue comment "$n" --repo "$REPO" --body "$msg"$'\n\n'"Only public-domain books are available. Try the exact title, or add the author."
                gh issue close "$n" --repo "$REPO" --reason "not planned" ;;
              *)
                gh issue comment "$n" --repo "$REPO" --body "$msg"$'\n\n'"Left open: the next request retries it. $RUN_URL" ;;
            esac
          done
