name: Send a book
description: Find a free public-domain EPUB, or send your own PDF, to the Kindle inbox.
title: "Book request"
labels: ["book"]
body:
  - type: input
    id: title
    attributes:
      label: Book title
      placeholder: Moby Dick
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author (optional)
      placeholder: Herman Melville
  - type: textarea
    id: pdf
    attributes:
      label: PDF (optional)
      description: Drag a PDF here (up to 25 MB) to send it as-is instead of searching. The repository is public, so anyone can download it.
